<!doctype html>
<meta charset="utf-8">
<title>QuestDB TCA live</title>
<style>
  :root { color-scheme: dark;
          --bg:#0f1216; --panel:#161a21; --fg:#d7dce3; --dim:#78828f;
          --line:#242a33; --pos:#4ec9a5; --neg:#e2705f; --hi:#8ab4f8; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--fg); margin:0; padding:1rem 1.25rem 2rem;
         font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

  header { display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
           margin-bottom:1rem; padding-bottom:.75rem; border-bottom:1px solid var(--line); }
  h1 { font-size:13px; font-weight:600; margin:0; letter-spacing:.02em; }
  header label { color:var(--dim); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:4px; padding:.25rem .5rem; font:inherit; }
  #meta { margin-left:auto; color:var(--dim); }

  /* Two columns on anything wide enough, one below that. The panels are independent, so a
     grid lets all four sit on one screen instead of scrolling. */
  #panels { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(540px, 1fr)); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px;
            padding:.75rem .9rem; min-width:0; overflow-x:auto; }
  h2 { font-size:12px; font-weight:600; margin:0 0 .1rem; color:var(--hi); }
  h2 span { color:var(--dim); font-weight:400; }
  .sub { color:var(--dim); margin:.55rem 0 .25rem; font-size:11.5px; }

  table { border-collapse:collapse; font-variant-numeric:tabular-nums; width:100%; }
  th, td { padding:.13rem .55rem; border-bottom:1px solid var(--line); text-align:right;
           white-space:nowrap; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  th:first-child, td:first-child { text-align:left; }
  td.pos { color:var(--pos); } td.neg { color:var(--neg); }
  caption { caption-side:bottom; color:var(--dim); text-align:left; padding-top:.3rem; }

  .sqlbtn { float:right; background:none; border:1px solid var(--line); color:var(--dim);
            border-radius:4px; font:inherit; font-size:11px; padding:0 .45rem; cursor:pointer; }
  .sqlbtn:hover { color:var(--fg); border-color:var(--dim); }
  pre.sql { background:#0b0e12; border:1px solid var(--line); border-radius:4px;
            padding:.6rem .7rem; margin:.5rem 0 0; overflow-x:auto; color:#9fb4cc;
            font-size:11.5px; white-space:pre; }
  #charts { display:grid; gap:1rem; margin-top:1rem;
            grid-template-columns:repeat(auto-fit, minmax(540px, 1fr)); }
  #charts section { padding-bottom:.5rem; }
  .legend { display:flex; gap:1rem; flex-wrap:wrap; color:var(--dim); font-size:11.5px;
            margin:.35rem 0 .2rem; }
  .legend span { display:flex; align-items:center; gap:.35rem; }
  .legend i { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .err { color:var(--neg); }
  .stale { opacity:.45; }
</style>
<header>
  <h1>QuestDB TCA live</h1>
  <label for=sym>symbol</label>
  <select id=sym><option value="">ALL</option></select>
  <label for=refresh>refresh</label>
  <select id=refresh>
    <option value=250>250ms</option>
    <option value=500>500ms</option>
    <option value=750>750ms</option>
    <option value=1000>1000ms</option>
    <option value=2000>2000ms</option>
    <option value=0>Off</option>
  </select>
  <span id=meta></span>
</header>
<div id=panels></div>
<div id=charts></div>
<script type="module" src="/app.js"></script>
